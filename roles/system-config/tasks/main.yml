- name: configure samba share
  ansible.builtin.copy:
    src: etc/samba/smb.conf
    dest: /etc/samba/smb.conf
    mode: "0644"

- name: enable samba
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - smb
    - nmb

- name: enable wsdd
  ansible.builtin.systemd:
    name: wsdd
    enabled: true
    state: started
