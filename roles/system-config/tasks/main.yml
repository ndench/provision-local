- name: configure samba share
  ansible.builtin.copy:
    src: etc/samba/smb.conf
    dest: /etc/samba/smb.conf
    mode: 0644

- name: enable samba
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - smb
    - nmb

- name: enable wsdd
  systemd:
    name: wsdd
    enabled: yes
    state: started
