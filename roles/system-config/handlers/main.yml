---

- name: restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: apply tmpfiles
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/disable-zswap.conf
  changed_when: true

- name: restart earlyoom
  ansible.builtin.systemd:
    name: earlyoom
    state: restarted

- name: restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
