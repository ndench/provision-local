Section "OutputClass"
    Identifier "intel"
    MatchDriver "i915"
    Driver "modesetting"
EndSection

Section "OutputClass"
    Identifier "nvidia"
    MatchDriver "nvidia-drm"
    Driver "nvidia"
    Option "AllowEmptyInitialConfiguration"
    Option "PrimaryGPU" "yes"
    Option "RegistryDwords" "EnableBrightnessControl=1"
    # Otherwise the DPI comes from the EDID of whichever monitor is first (161 with the 4K dock monitor),
    # which makes the i3 bar, fonts and greeter ~1.7x too big
    Option "UseEdidDpi" "False"
    Option "DPI" "96 x 96"
    ModulePath "/usr/lib/nvidia/xorg"
    ModulePath "/usr/lib/xorg/modules"
EndSection
