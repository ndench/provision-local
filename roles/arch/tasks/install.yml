---

- name: enable parallel downloads in pacman
  lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?ParallelDownloads'
    line: 'ParallelDownloads = 5'

- name: check for pritunl repo signing key
  command: pacman-key --list-keys {{ pritunl_key_id }}
  register: pritunl_key
  changed_when: false
  failed_when: false

# https://client.pritunl.com/
- name: add pritunl repo signing key
  shell: >
    curl -fsSL https://raw.githubusercontent.com/pritunl/pgp/master/pritunl_repo_pub.asc | pacman-key --add -
    && pacman-key --lsign-key {{ pritunl_key_id }}
  when: pritunl_key.rc != 0

- name: add pritunl repo
  lineinfile:
    path: /etc/pacman.conf
    line: '[pritunl]'

- name: add pritunl repo server
  lineinfile:
    path: /etc/pacman.conf
    line: 'Server = https://repo.pritunl.com/stable/pacman'
    insertafter: '^\[pritunl\]'

# pacman.conf only supports comments on their own line
- name: hold back flameshot
  lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?IgnorePkg'
    line: 'IgnorePkg   = flameshot'

- name: explain why flameshot is held back
  lineinfile:
    path: /etc/pacman.conf
    line: '# flameshot 14.0.0-1 is broken, only meant to skip that version. Remove once a newer version is out'
    insertbefore: '^IgnorePkg'

- name: run system upgrade
  pacman:
    update_cache: yes
    upgrade: yes

- name: enable parallel builds in makepkg
  lineinfile:
    path: /etc/makepkg.conf
    regexp: '^#?MAKEFLAGS="-j2"'
    line: 'MAKEFLAGS="-j2"'

- name: install reflector
  pacman:
    name: reflector
    state: present

- name: configure reflector unit file
  copy:
    src: etc/systemd/system/reflector.service
    dest: /etc/systemd/system/reflector.service
    mode: 0644
    backup: true

- name: run reflector
  systemd:
    name: reflector
    state: started
    daemon_reload: yes

- meta: flush_handlers

- name: create pacman hooks directory
  file:
    path: /etc/pacman.d/hooks
    state: directory
    mode: 0755

- name: configure reflector pacman hook
  copy:
    src: etc/pacman.d/hooks/mirrorupgrade.hook
    dest: /etc/pacman.d/hooks/mirrorupgrade.hook
    mode: 0644
    backup: true

#- name: create zsh hash directory
#  file:
#    path: /var/cache/zsh
#    state: directory
#    mode: 0755

#- name: configure zsh rehash hook
#  copy:
#    src: etc/pacman.d/hooks/zsh.hook
#    dest: /etc/pacman.d/hooks/zsh.hook
#    mode: 0644

# --nodeps twice skips dependency checks so packages that depend on these
# (eg. ffmpeg -> jack) don't block removal; the PipeWire replacements
# installed in the next task provide them again
- name: remove conflicting pacman packages
  pacman:
    name: "{{ pacman_packages_absent }}"
    state: absent
    extra_args: --nodeps --nodeps

- name: install pacman packages
  pacman:
    name: "{{ pacman_packages }}"
    state: present

- name: enable tlp
  systemd:
    name: tlp
    enabled: yes
    state: started

- name: enable bluetooth
  systemd:
    name: bluetooth
    enabled: yes
    state: started

# systemd-rfkill conflicts with tlp
# https://wiki.archlinux.org/index.php/TLP
- name: mask systemd-rfkill
  systemd:
    name: "{{ item }}"
    masked: yes
    enabled: no
    state: stopped
  loop:
    - systemd-rfkill.service
    - systemd-rfkill.socket

- name: enable docker
  systemd:
    name: docker
    state: started
    enabled: yes

# Weekly paccache run, keeps the last 3 versions of each package
- name: enable paccache timer
  systemd:
    name: paccache.timer
    enabled: yes
    state: started

- name: enable cron
  systemd:
    name: cronie
    enabled: yes
    state: started

- name: enable pritunl client
  systemd:
    name: pritunl-client
    enabled: yes
    state: started

- name: enable clamav signature updates
  systemd:
    name: clamav-freshclam-once.timer
    enabled: yes
    state: started

# Only enabled, the daemon can't start until freshclam has downloaded the signatures
- name: enable clamav daemon
  systemd:
    name: "{{ item }}"
    enabled: yes
  loop:
    - clamav-daemon.service
    - clamav-daemon.socket

- name: create aur_builder user (kewlifft/ansible-aui)
  user:
    name: aur_builder
    group: wheel
    system: yes
    password_lock: yes

- name: install yay
  aur: 
    name: yay
    state: present
    aur_only: yes
    use: makepkg
  become: yes
  become_user: aur_builder

- name: install aur packages
  aur:
    name: "{{ aur_packages }}"
    state: present
    aur_only: yes
    use: yay
  become: yes
  become_user: aur_builder

- name: create local PKGBUILD build directory
  file:
    path: /var/tmp/pkgbuilds
    state: directory
    owner: aur_builder
    mode: 0755

- name: copy local PKGBUILDs
  copy:
    src: "{{ playbook_dir }}/pkgbuilds/{{ item }}/"
    dest: "/var/tmp/pkgbuilds/{{ item }}/"
    owner: aur_builder
  loop: "{{ local_packages }}"

- name: install local PKGBUILD packages
  aur:
    name: "{{ item }}"
    state: present
    use: makepkg
    local_pkgbuild: "/var/tmp/pkgbuilds/{{ item }}"
  # Build on disk, phpstorm-light needs ~11G which doesn't fit in the /tmp tmpfs
  environment:
    TMPDIR: /var/tmp
  become: yes
  become_user: aur_builder
  loop: "{{ local_packages }}"

# AUR and local builds leave GBs of sources behind (eg. phpstorm-light is ~10G)
- name: remove build caches
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/tmp/pkgbuilds
    - /home/aur_builder/.cache/yay
