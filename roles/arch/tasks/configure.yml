---

- name: check default target
  command: systemctl get-default
  register: default_target

- name: set default target
  command: systemctl set-default graphical.target
  when: default_target.stdout != "graphical.target"

- name: configure lightdm-greeter
  copy:
    src: etc/lightdm/lightdm-gtk-greeter.conf
    dest: /etc/lightdm/lightdm-gtk-greeter.conf
    backup: true

- name: add lightdm display setup script
  copy:
    src: etc/lightdm/display_setup.sh
    dest: /etc/lightdm/display_setup.sh
    backup: true

- name: configure lightdm display setup script
  lineinfile:
    path: /etc/lightdm/lightdm.conf
    regexp: '^#display-setup-script='
    line: display-setup-script=/etc/lightdm/display_setup.sh
    backup: true

- name: enable lightdm
  systemd:
    name: lightdm
    enabled: yes

- name: copy vconsole.conf
  copy:
    src: etc/vconsole.conf
    dest: /etc/vconsole.conf
    backup: true

- name: configure tlp
  copy:
    src: "{{ item }}"
    dest: /etc/tlp.d/
    backup: true
  with_items:
    - etc/tlp.d/10-processor.conf
    - etc/tlp.d/20-battery-care.conf

# Early KMS for nvidia: https://wiki.archlinux.org/title/NVIDIA#Early_loading
# The nvidia firmware adds ~100M to the initramfs, so skip it if /boot is the old 260M partition
- name: get /boot size
  set_fact:
    boot_size: "{{ (ansible_mounts | selectattr('mount', 'equalto', '/boot') | first).size_total }}"

- name: load nvidia modules early
  lineinfile:
    path: /etc/mkinitcpio.conf
    regexp: '^MODULES='
    line: 'MODULES=(i915 nvidia nvidia_modeset nvidia_uvm nvidia_drm)'
    backup: true
  when: boot_size | int >= 1073741824
  notify: rebuild initramfs

# The kms hook adds nouveau to the initramfs
- name: remove kms hook
  replace:
    path: /etc/mkinitcpio.conf
    regexp: '^(HOOKS=\(.*?) kms\b'
    replace: '\1'
  when: boot_size | int >= 1073741824
  notify: rebuild initramfs

- name: rebuild initramfs when nvidia is upgraded
  copy:
    src: etc/pacman.d/hooks/nvidia.hook
    dest: /etc/pacman.d/hooks/nvidia.hook
    mode: 0644
  when: boot_size | int >= 1073741824
