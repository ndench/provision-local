---

- name: read ssh public key for github
  shell: cat "{{ ansible_env.HOME }}/.ssh/id_rsa.pub"
  register: ssh_pub_key

- name: add ssh public key to github
  github_key:
    name: "{{ ansible_hostname }}"
    token: "{{ github_token }}"
    pubkey: "{{ ssh_pub_key.stdout }}"

- name: enable pipewire user services
  systemd:
    name: "{{ item }}"
    scope: user
    enabled: yes
  loop:
    - pipewire.socket
    - pipewire-pulse.socket
    - wireplumber.service

- name: create user systemd and bin directories
  file:
    dest: "{{ ansible_env.HOME }}/{{ item }}"
    state: directory
  loop:
    - .local/bin
    - .config/systemd/user

- name: copy cache cleanup script
  copy:
    src: home/local/bin/cleanup-caches
    dest: "{{ ansible_env.HOME }}/.local/bin/cleanup-caches"
    mode: 0755

- name: copy cache cleanup units
  copy:
    src: "home/config/systemd/user/{{ item }}"
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ item }}"
  loop:
    - cleanup-caches.service
    - cleanup-caches.timer

- name: enable cache cleanup timer
  systemd:
    name: cleanup-caches.timer
    scope: user
    enabled: yes
    state: started
    daemon_reload: yes

# updates.sh comes from the dotfiles repo
- name: check for updates on boot and hourly
  cron:
    name: "check for updates {{ item }}"
    special_time: "{{ item }}"
    job: "{{ ansible_env.HOME }}/bin/updates.sh"
  loop:
    - reboot
    - hourly

- name: copy rcm config
  copy:
    src: home/rcrc
    dest: "{{ ansible_env.HOME }}/.rcrc"
    backup: true

- name: clone dotfiles repo
  git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ ansible_env.HOME }}/.dotfiles"
    accept_hostkey: yes

- name: copy wakatime config
  copy:
    src: home/wakatime.cfg
    dest: "{{ ansible_env.HOME }}/.wakatime.cfg"
    mode: 0600

- name: create .docker directory
  file:
    dest: "{{ ansible_env.HOME }}/.docker"
    state: directory

- name: copy docker config
  copy:
    src: home/docker/config.json
    dest: "{{ ansible_env.HOME }}/.docker/config.json"
    mode: 0600

- name: copy hub config
  copy:
    src: home/config/hub
    dest: "{{ ansible_env.HOME }}/.config/hub"
    mode: 0600

- name: create .ngrok2 directory
  file:
    dest: "{{ ansible_env.HOME }}/.ngrok2"
    state: directory

- name: copy ngrok config
  copy:
    src: home/ngrok2/ngrok.yml
    dest: "{{ ansible_env.HOME }}/.ngrok2/ngrok.yml"
    mode: 0600

