---

- name: read ssh public key for github
  ansible.builtin.shell: cat "{{ ansible_facts.env.HOME }}/.ssh/id_ed25519.pub"
  register: ssh_pub_key
  changed_when: false
  check_mode: false # read-only, and the next task needs its output

- name: add ssh public key to github
  community.general.github_key:
    name: "{{ ansible_facts.hostname }}"
    token: "{{ github_token }}"
    pubkey: "{{ ssh_pub_key.stdout }}"

- name: enable pipewire user services
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    enabled: true
  loop:
    - pipewire.socket
    - pipewire-pulse.socket
    - wireplumber.service

# Dark theme. ~/.config/gtk-3.0/settings.ini (from the dotfiles) covers plain GTK 3 apps,
# but GTK 4/libadwaita apps, and browsers/Electron apps through xdg-desktop-portal, read
# color-scheme from dconf instead
- name: prefer the dark theme
  community.general.dconf:
    key: "/org/gnome/desktop/interface/{{ item.key }}"
    value: "{{ item.value }}"
  loop:
    - { key: color-scheme, value: "'prefer-dark'" }
    - { key: gtk-theme, value: "'Adwaita-dark'" }

- name: create user systemd and bin directories
  ansible.builtin.file:
    dest: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: directory
  loop:
    - .local/bin
    - .config/systemd/user

# cleanup-caches: weekly prune of docker, yay and codex caches
# pacnew-check: daily notification while there are .pacnew files to merge
- name: copy timer scripts
  ansible.builtin.copy:
    src: "home/local/bin/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }}"
    mode: "0755"
  loop: "{{ user_timers }}"

- name: copy timer units
  ansible.builtin.copy:
    src: "home/config/systemd/user/{{ item.0 }}.{{ item.1 }}"
    dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/{{ item.0 }}.{{ item.1 }}"
  loop: "{{ user_timers | product(['service', 'timer']) | list }}"

- name: enable timers
  ansible.builtin.systemd:
    name: "{{ item }}.timer"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ user_timers }}"

# updates.sh comes from the dotfiles repo
- name: check for updates on boot and hourly
  ansible.builtin.cron:
    name: "check for updates {{ item }}"
    special_time: "{{ item }}"
    job: "{{ ansible_facts.env.HOME }}/bin/updates.sh"
  loop:
    - reboot
    - hourly

- name: copy rcm config
  ansible.builtin.copy:
    src: home/rcrc
    dest: "{{ ansible_facts.env.HOME }}/.rcrc"
    backup: true

- name: clone dotfiles repo
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ ansible_facts.env.HOME }}/.dotfiles"
    accept_hostkey: true
    update: false # only clone; never reset a working copy that has local or unpushed changes

- name: copy wakatime config
  ansible.builtin.copy:
    src: home/wakatime.cfg
    dest: "{{ ansible_facts.env.HOME }}/.wakatime.cfg"
    mode: "0600"

- name: create .docker directory
  ansible.builtin.file:
    dest: "{{ ansible_facts.env.HOME }}/.docker"
    state: directory

- name: copy docker config
  ansible.builtin.copy:
    src: home/docker/config.json
    dest: "{{ ansible_facts.env.HOME }}/.docker/config.json"
    mode: "0600"

- name: copy hub config
  ansible.builtin.copy:
    src: home/config/hub
    dest: "{{ ansible_facts.env.HOME }}/.config/hub"
    mode: "0600"

- name: create .ngrok2 directory
  ansible.builtin.file:
    dest: "{{ ansible_facts.env.HOME }}/.ngrok2"
    state: directory

- name: copy ngrok config
  ansible.builtin.copy:
    src: home/ngrok2/ngrok.yml
    dest: "{{ ansible_facts.env.HOME }}/.ngrok2/ngrok.yml"
    mode: "0600"

# Disable to see if it's causing kernel panics on boot
#- name: enable redshift
#  systemd:
#    name: "{{ item }}"
#    scope: user
#    state: started
#    enabled: yes
#  with_items:
#    - redshift-gtk

# Last task in the playbook so it's easy to spot. See "Merging .pacnew files" in the README
- name: find .pacnew files
  ansible.builtin.command: pacdiff --output
  register: pacnew_files
  changed_when: false

- name: warn about .pacnew files
  ansible.builtin.debug:
    msg:
      - ".pacnew files need merging, review with: sudo DIFFPROG='nvim -d' pacdiff"
      - "{{ pacnew_files.stdout_lines }}"
  when: pacnew_files.stdout_lines | length > 0
